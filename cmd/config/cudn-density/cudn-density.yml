---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
{{ if .PPROF }}
  measurements:
    - name: pprof
      pprofInterval: {{.PPROF_INTERVAL}}
      pprofDirectory: pprof-data
      pprofTargets:
      - name: ovnkube-controller-heap
        namespace: "openshift-ovn-kubernetes"
        labelSelector: {app: ovnkube-node}
        url: http://localhost:29103/debug/pprof/heap
      - name: ovnkube-controller-cpu
        namespace: "openshift-ovn-kubernetes"
        labelSelector: {app: ovnkube-node}
        url: http://localhost:29103/debug/pprof/profile?seconds=60
      - name: ovnk-control-plane-heap
        namespace: "openshift-ovn-kubernetes"
        labelSelector: {app: ovnkube-control-plane}
        url: http://localhost:29108/debug/pprof/heap
      - name: ovnk-control-plane-cpu
        namespace: "openshift-ovn-kubernetes"
        labelSelector: {app: ovnkube-control-plane}
        url: http://localhost:29108/debug/pprof/profile?seconds=60
{{ end }}
metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}

{{ $cudnJobName := ternary "cudn-density-create-cudn-l3" "cudn-density-create-cudn-l2" .ENABLE_LAYER_3 }}
jobs:
  # Job 1: Create namespaces with CUDN labels
  - name: cudn-density-create-namespaces
    namespace: cudn-density
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    waitWhenFinished: true
    skipIndexing: true
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
      k8s.ovn.org/primary-user-defined-network: ""
    objects:
      - objectTemplate: configmap.yml
        replicas: 1

  # Job 2: Create CUDNs (cluster-scoped)
  - name: {{ $cudnJobName }}
    {{- $numCudn := div .JOB_ITERATIONS .NAMESPACES_PER_CUDN }}
    jobIterations: {{$numCudn}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: false
    waitWhenFinished: true
    jobPause: {{.JOB_PAUSE}}
    measurements:
      - name: cudnLatency
    objects:
      {{ if .ENABLE_LAYER_3 }}
      - objectTemplate: cudn-l3.yml
        replicas: 1
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}
          total_namespaces: {{.JOB_ITERATIONS}}
          cudn_per_ra: 1
        waitOptions:
          customStatusPaths:
            - key: .conditions[] | select(.type=="NetworkCreated") | .status
              value: "True"
      {{ else }}
      - objectTemplate: cudn-l2.yml
        replicas: 1
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}
          total_namespaces: {{.JOB_ITERATIONS}}
          cudn_per_ra: 1
        waitOptions:
          customStatusPaths:
            - key: .conditions[] | select(.type=="NetworkCreated") | .status
              value: "True"
      {{ end }}
      {{ if .BGP }}
      - objectTemplate: ra.yml
        replicas: 1
        repeatEveryNIterations: 1
      {{ end }}

  # Job 3: Deploy infra + workload (services, NPs, EgressFirewall, quotas, deployments)
  - name: cudn-density-workload
    namespace: cudn-density
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    waitWhenFinished: true
    preLoadImages: true
    measurements:
      - name: podLatency
{{ if ne .POD_READY_THRESHOLD 0 }}
        thresholds:
          - conditionType: Ready
            metric: P99
            threshold: {{.POD_READY_THRESHOLD}}
{{ end }}
    churnConfig:
      cycles: {{.CHURN_CYCLES}}
      duration: {{.CHURN_DURATION}}
      percent: {{.CHURN_PERCENT}}
      delay: {{.CHURN_DELAY}}
      mode: {{.CHURN_MODE}}
    jobPause: 2m
    metricsClosing: afterJobPause
    cleanup: false
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
      k8s.ovn.org/primary-user-defined-network: ""
    objects:
{{ if .VIRT }}
{{ if .SSH_CHECK }}
      - objectTemplate: secret_ssh_public.yml
        replicas: 1
        inputVars:
          name: cudn-density-ssh
          publicKeyPath: {{ .publicKey }}

      - objectTemplate: vm-cudn-ssh.yml
        replicas: 1
        inputVars:
          vmImage: {{.VM_IMAGE}}
          sshPublicKeySecret: cudn-density-ssh
{{ else }}
      - objectTemplate: vm-cudn.yml
        replicas: 1
        inputVars:
          vmImage: {{.VM_IMAGE}}
{{ end }}
{{ end }}
      - objectTemplate: service.yml
        replicas: 1
        churn: false

      - objectTemplate: service-headless.yml
        replicas: 1
        churn: false

      - objectTemplate: service-server.yml
        replicas: 1
        churn: false

      - objectTemplate: np-allow-cudn-ingress.yml
        replicas: 1
        churn: false
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}

      - objectTemplate: np-allow-cudn-egress.yml
        replicas: 1
        churn: false
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}

      - objectTemplate: np-allow-app-ingress.yml
        replicas: 1
        churn: false
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}

      - objectTemplate: np-allow-app-egress.yml
        replicas: 1
        churn: false
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}

      - objectTemplate: egressfirewall.yml
        replicas: 1
        churn: false
        inputVars:
          gatewayIP: "{{ if .GATEWAY_CHECK }}{{.GATEWAY_IP}}{{ end }}"

      - objectTemplate: resourcequota.yml
        replicas: 1
        churn: false

      - objectTemplate: limitrange.yml
        replicas: 1
        churn: false

      - objectTemplate: deployment-server.yml
        replicas: 1
        inputVars:
          podReplicas: 2

      - objectTemplate: deployment-app.yml
        replicas: 1
        inputVars:
          podReplicas: 1

      - objectTemplate: deployment-client.yml
        replicas: 1
        inputVars:
          podReplicas: 1
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}
          gatewayIP: "{{ if .GATEWAY_CHECK }}{{.GATEWAY_IP}}{{ end }}"

{{ if .GATEWAY_CHECK }}
      - objectTemplate: np-allow-gateway-egress.yml
        replicas: 1
        churn: false
        inputVars:
          gatewayIP: {{.GATEWAY_IP}}
{{ end }}


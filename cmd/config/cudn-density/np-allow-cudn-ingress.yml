# Scenario B: allow http/https to nginx from anywhere so NodePort hairpin
# paths are not blocked when the source no longer looks like the client pod.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-cudn-ingress-{{.Replica}}
spec:
  podSelector:
    matchLabels:
      app: nginx
  ingress:
  - ports:
    - protocol: TCP
      port: http
    - protocol: TCP
      port: https
  {{ if .bgp }}
  - from:
    - ipBlock:
        cidr: {{.externalHostCidr}}
    ports:
    - protocol: TCP
      port: 2222
  {{ end }}
  policyTypes:
  - Ingress

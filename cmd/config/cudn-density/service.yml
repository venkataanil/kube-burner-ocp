# Scenario B: NodePort service for east-west client -> server traffic.
# Unique nodePort per iteration/namespace so services do not collide on the node:
#   http  nodePort = 30080 + Iteration  (iter 0 -> 30080, iter 1 -> 30081, ...)
#   https nodePort = 31080 + Iteration
# Clients must curl the matching http port (see deployment-client.yml NODEPORT_URL).
kind: Service
apiVersion: v1
metadata:
  name: cudn-svc
spec:
  selector:
    app: nginx
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: {{ add 30080 .Iteration }}
  - name: https
    protocol: TCP
    port: 8443
    targetPort: 8443
    nodePort: {{ add 31080 .Iteration }}
  type: NodePort

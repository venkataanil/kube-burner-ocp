# Scenario B egress for client pods:
# - NodePort / cluster paths (RFC1918-ish + common cluster CIDRs) on http/https
# - External MAC-binding targets (198.18.0.0/16), all protocols including ICMP
# - DNS
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-cudn-egress-{{.Replica}}
spec:
  podSelector:
    matchLabels:
      app: client
  egress:
  {{- $cudnGroupIdx := div .Iteration .namespaces_per_cudn }}
  {{- $cudnBase := mul $cudnGroupIdx .namespaces_per_cudn }}
  {{- $nsList := list }}
  {{- range $i, $v := until .namespaces_per_cudn }}
    {{- $nsIter := add $cudnBase $i }}
    {{- $nsName := print "cudn-density-" $nsIter }}
    {{- $nsList = append $nsList $nsName }}
  {{- end }}
  {{- $nsNames := toJson $nsList }}
  - to:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{$nsNames}}
      podSelector:
        matchLabels:
          app: nginx
    ports:
    - protocol: TCP
      port: http
    - protocol: TCP
      port: https
  # NodePort via node IPs (AWS VPC / private ranges). No port filter so
  # kube-proxy NodePort and related paths are not blocked by NP.
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
  - to:
    - ipBlock:
        cidr: 172.16.0.0/12
  - to:
    - ipBlock:
        cidr: 192.168.0.0/16
  # External fping targets for MAC-binding stress (all protocols, incl. ICMP)
  - to:
    - ipBlock:
        cidr: 198.18.0.0/16
  # DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  policyTypes:
  - Egress
